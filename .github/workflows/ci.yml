name: PR 检查(后端测试 + 前端构建 + 镜像构建)

# 每个 PR 与推送 main 时运行:后端自包含测试、前端类型检查与构建、两个镜像的构建(不推送)。
# Python 3.12 与锁定依赖和后端镜像一致;镜像只构建不推送,用于提前发现 Dockerfile 与依赖问题。
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-version.sh

  backend-tests:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: python -m pip install -r backend/requirements.txt

      - name: 运行 tests/test_*.py
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          UPLOAD_DIR: ${{ runner.temp }}/uploads
        run: |
          failed=""
          for f in tests/test_*.py; do
            m="tests.$(basename "$f" .py)"
            echo "::group::$m"
            if ! python -m "$m"; then failed="$failed $m"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::失败的测试模块:$failed"
            exit 1
          fi

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 类型检查并构建
        working-directory: frontend
        run: |
          npm ci
          npm run build

  docker-build:
    name: 镜像构建(${{ matrix.name }},不推送)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: 构建
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha
