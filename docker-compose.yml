services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finance}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # 预构建镜像(GHCR):deploy.sh 优先 pull;拉取失败回退下方本地 build
    image: ${BACKEND_IMAGE:-ghcr.io/lsgoodlionel/cw-backend:latest}
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-finance}:${POSTGRES_PASSWORD:-finance}@db:5432/${POSTGRES_DB:-finance}
      UPLOAD_DIR: /data/uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      REQUIRE_AUTH: ${REQUIRE_AUTH:-true}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-please-set-AUTH_SECRET}
      # 用 ${VAR-default}(无冒号):仅「未设置」时兜底 admin123;显式空值(SaaS 首登设置)保留为空
      ADMIN_PASSWORD: ${ADMIN_PASSWORD-admin123}
      DEPLOY_MODE: ${DEPLOY_MODE:-private}
      ALLOW_SELF_REGISTRATION: ${ALLOW_SELF_REGISTRATION:-false}
      TRIAL_DAYS: ${TRIAL_DAYS:-30}
      # 运行诊断:出错自动打包日志并上传到共享 GitHub 仓库(供开发拉取排查)
      ERROR_REPORT_ENABLED: ${ERROR_REPORT_ENABLED:-true}
      PAPER_REPO: ${PAPER_REPO:-lsgoodlionel/paper}
      PAPER_REPO_TOKEN: ${PAPER_REPO_TOKEN:-}
      PAPER_REPO_BRANCH: ${PAPER_REPO_BRANCH:-main}
      LOG_APP_SLUG: ${LOG_APP_SLUG:-CW}
      ERROR_REPORT_COOLDOWN: ${ERROR_REPORT_COOLDOWN:-600}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/lsgoodlionel/cw-frontend:latest}
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
